<body>

    <h1 class="poem-title">烏衣巷（劉禹錫）</h1>

    <img src="劉禹錫.jpg" alt="劉禹錫畫像" class="poet-img">

    <div class="poem-content">
        <p>
            朱雀橋邊野草花，<br>
            烏衣巷口夕陽斜。<br>
            舊時王謝堂前燕，<br>
            飛入尋常百姓家。
        </p>
    </div>
